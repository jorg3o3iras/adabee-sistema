<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotoJá — Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{ -webkit-tap-highlight-color:transparent } body{font-family:'Inter',sans-serif;background:#0A0A0A}
.sora{font-family:'Sora',sans-serif}.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(24px)}
.shadow-premium{box-shadow:0 8px 32px rgba(0,0,0,.18)}.shadow-premium-lg{box-shadow:0 20px 60px rgba(0,0,0,.22)}
.mk-origem{width:18px;height:18px;border-radius:50%;background:#FF6A00;border:3px solid #fff;box-shadow:0 4px 12px rgba(255,106,0,.5)}
.mk-dest{width:14px;height:14px;background:#0A0A0A;border:3px solid #fff}
.mk-eu{width:22px;height:22px;border-radius:50%;background:#1E88E5;border:3px solid #fff;position:relative}
.mk-eu::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(30,136,229,.25);animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
</style>
</head>
<body class="overflow-hidden h-[100dvh] w-screen relative">
<div id="map" class="absolute inset-0 z-0"></div>
